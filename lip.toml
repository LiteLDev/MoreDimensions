format = 4
id = "github.com/LiteLDev/MoreDimensions"
version = "0.16.0"

[info]
name = "MoreDimensions"
description = "An API for adding custom dimensions to Minecraft Bedrock Edition, on the server and the client."
tags = ["library"]
logo = "https://raw.githubusercontent.com/LiteLDev/MoreDimensions/develop/docs/logo.png"

# The default variant holds both builds: the server build for Bedrock Dedicated Server and the
# client build for Minecraft for Windows. There is no "client" variant: lip and LeviLauncher pick
# the entry by side. LeviLamina 26.60.x loads mods from mods/ on both sides.

# --- Server ---------------------------------------------------------------------------------------

[[variants.""]]
side = "server"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = ">=26.60.7 <26.61.0"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/MoreDimensions-server-windows-x64.zip"]
place = [{ src = "more-dimensions/", dest = "mods/more-dimensions/" }]

# --- Client ---------------------------------------------------------------------------------------

[[variants.""]]
side = "client"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = ">=26.60.7 <26.61.0"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/MoreDimensions-client-windows-x64.zip"]
place = [{ src = "more-dimensions/", dest = "mods/more-dimensions/" }]
